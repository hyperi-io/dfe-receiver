# =============================================================================
# Per-target CPU optimisations
# =============================================================================
# x86_64: AVX2 + SSE4.2 (available on all modern Intel/AMD since ~2013)
# aarch64: NEON (baseline for all ARM64)

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]  # AVX2, BMI1/2, FMA (Haswell+)

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic"]    # NEON is baseline for ARM64

# For local development, use native CPU features
[build]
rustflags = ["-C", "target-cpu=native"]

# =============================================================================
# HyperI Private Cargo Registry (Artifactory)
# =============================================================================

[registries.hyperi]
index = "sparse+https://hypersec.jfrog.io/artifactory/api/cargo/hyperi-cargo-virtual/index/"
credential-provider = "cargo:token"
