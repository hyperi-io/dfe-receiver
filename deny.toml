# Project:   dfe-receiver
# File:      deny.toml
# Purpose:   cargo-deny configuration for license and advisory checks
# Language:  TOML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[graph]
targets = []
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable, and no patched release exists. dfe-receiver uses it directly, and scalo, cel, file-rotate, netgauze-flow-pkt and syslog_loose depend on it too. Drop when the lock no longer resolves chrono." },
    { id = "GHSA-qwgh-2vcv-g2f7", reason = "Reached via digest 0.10 <- sha1 <- aws-config <- scalo. The advisory needs a caught panic inside a hasher's compress callback followed by reuse of that buffer, and the SHA-1 compress does not panic. Drop when that chain moves to digest 0.11, which pulls block-buffer 0.12.1." },
]

[licenses]
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
    # notify, via yaque, via scalo. Dual CC0-1.0 OR Artistic-2.0; both permissive.
    "CC0-1.0",
    "Artistic-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# BUSL-1.1 carries per-project Change Date and Additional Use Grant lines, so the
# text scores too low for cargo-deny to identify it from the file alone.
[[licenses.clarify]]
name = "dfe-receiver"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0x1d547099 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# scalo is pinned to a git commit until the release that ships ServerTls replaces it.
allow-git = ["https://github.com/hyperi-io/scalo-rs"]
