# Project gitleaks allowlist: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positive allowlist"

paths = []

regexes = [
    '''YOUR_.*_TOKEN''',
    '''your-.*-token''',
    '''your-token''',
    '''test-token''',
    '''example\.com''',
    '''<[A-Z_]+>''',  # Angle bracket placeholders like <YOUR_TOKEN>
]

stopwords = ["example", "sample", "test", "mock", "fake", "dummy", "placeholder"]
