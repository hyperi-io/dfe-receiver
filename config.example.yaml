# dfe-receiver configuration example
# Copy to config.yaml and customise for your environment
#
# Environment variables: DFE_RECEIVER_* prefix
# Nesting: DFE_RECEIVER_SERVER__BIND_ADDRESS=0.0.0.0:8080
# Config reload: send SIGHUP to reload routing/validation/enrichment

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760  # 10MB
  request_timeout_ms: 30000

  tls:
    enabled: false
    cert_file: "/etc/ssl/receiver.crt"
    key_file: "/etc/ssl/receiver.key"
    ca_file: "/etc/ssl/ca.crt"
    client_auth: "none"  # none, optional, required
    # Secret manager sources (override file paths when set)
    # cert_secret: "vault:secret/tls:cert"
    # key_secret: "vault:secret/tls:key"
    # ca_secret: "vault:secret/tls:ca"
    # refresh_interval_secs: 3600  # Hot-reload interval (1 hour)

  auth:
    mode: "none"  # none, header, bearer, mtls, both
    # Include the common x-hyperi-agent header in accepted headers.
    # Also gates source rule evaluation and _timestamp_receiver enrichment.
    include_common_header: true
    accepted_headers:
      - name: "x-api-key"
        values: ["my-api-key"]
    bearer:
      tokens: []
      # secret_source: "vault:secret/data/auth:bearer_tokens"
      refresh_interval_secs: 300

grpc:
  enabled: false
  bind_address: "0.0.0.0:6000"

  # gRPC TLS (same options as HTTP TLS)
  tls:
    enabled: false
    cert_file: "/etc/ssl/grpc-receiver.crt"
    key_file: "/etc/ssl/grpc-receiver.key"
    # ca_file: "/etc/ssl/ca.crt"        # For mTLS
    # client_auth: "none"               # none, optional, required
    # cert_secret: "vault:secret/tls:cert"  # Load from secret manager
    # key_secret: "vault:secret/tls:key"
    # refresh_interval_secs: 3600       # Hot-reload interval (1 hour)

  # gRPC auth (same options as HTTP auth)
  auth:
    mode: "none"  # none, bearer
    # bearer:
    #   tokens: []
    #   secret_source: "file:/etc/secrets/grpc-tokens"
    #   refresh_interval_secs: 300

# Lumberjack v2 / Beats protocol (Filebeat, Winlogbeat, etc.)
lumberjack:
  enabled: false
  bind_address: "0.0.0.0:5044"

  # TLS (recommended — Beats clients typically expect TLS)
  tls:
    enabled: false
    cert_file: "/etc/ssl/beats-receiver.crt"
    key_file: "/etc/ssl/beats-receiver.key"
    # ca_file: "/etc/ssl/ca.crt"        # For mTLS
    # client_auth: "none"               # none, optional, required
    # cert_secret: "vault:secret/tls:cert"
    # key_secret: "vault:secret/tls:key"
    # refresh_interval_secs: 3600

  # Auth (same options as HTTP/gRPC auth)
  auth:
    mode: "none"
    # bearer:
    #   tokens: []
    #   secret_source: "file:/etc/secrets/beats-tokens"
    #   refresh_interval_secs: 300

# Splunk HEC (HTTP Event Collector) protocol
splunk_hec:
  enabled: false
  bind_address: "0.0.0.0:8088"
  max_body_size: 10485760  # 10MB
  request_timeout_ms: 30000

  # TLS (same options as HTTP TLS)
  tls:
    enabled: false
    cert_file: "/etc/ssl/hec-receiver.crt"
    key_file: "/etc/ssl/hec-receiver.key"
    # ca_file: "/etc/ssl/ca.crt"
    # client_auth: "none"
    # cert_secret: "vault:secret/tls:cert"
    # key_secret: "vault:secret/tls:key"
    # refresh_interval_secs: 3600

  # Auth — supports both "Authorization: Splunk <token>" and "Authorization: Bearer <token>"
  auth:
    mode: "none"  # none, bearer
    # bearer:
    #   tokens: ["your-hec-token"]
    #   secret_source: "file:/etc/secrets/hec-tokens"
    #   refresh_interval_secs: 300

# Syslog receiver (RFC 5424 + RFC 3164 auto-detect)
syslog:
  enabled: false
  udp_bind_address: "0.0.0.0:514"
  tcp_bind_address: "0.0.0.0:514"
  tls_bind_address: "0.0.0.0:6514"
  max_message_size: 65536  # 64KB

  # TLS for secure syslog (RFC 5425, port 6514)
  tls:
    enabled: false
    cert_file: "/etc/ssl/syslog-receiver.crt"
    key_file: "/etc/ssl/syslog-receiver.key"
    # ca_file: "/etc/ssl/ca.crt"
    # client_auth: "none"
    # cert_secret: "vault:secret/tls:cert"
    # key_secret: "vault:secret/tls:key"
    # refresh_interval_secs: 3600

  auth:
    mode: "none"
    # bearer:
    #   tokens: []
    #   secret_source: "file:/etc/secrets/syslog-tokens"
    #   refresh_interval_secs: 300

# Prometheus Remote Write receiver (v1)
prometheus_rw:
  enabled: false
  bind_address: "0.0.0.0:9090"
  # Output mode: "native" (default), "otel", or "hyperdx"
  # - native: flat JSON with labels as top-level fields
  # - otel: generic OTel JSON envelope (for custom pipelines)
  # - hyperdx: HyperDX ClickHouse-compatible JSON (otel_metrics_* tables)
  mode: "native"
  max_body_size: 10485760  # 10MB
  request_timeout_ms: 30000

  # TLS (same options as HTTP TLS)
  tls:
    enabled: false
    cert_file: "/etc/ssl/prometheus-receiver.crt"
    key_file: "/etc/ssl/prometheus-receiver.key"
    # ca_file: "/etc/ssl/ca.crt"
    # client_auth: "none"
    # cert_secret: "vault:secret/tls:cert"
    # key_secret: "vault:secret/tls:key"
    # refresh_interval_secs: 3600

  # Auth (same options as HTTP auth)
  auth:
    mode: "none"
    # bearer:
    #   tokens: []
    #   secret_source: "file:/etc/secrets/prometheus-tokens"
    #   refresh_interval_secs: 300

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

routing:
  # Source rules (first match wins). Only evaluated when include_common_header is true.
  # Modes:
  #   key_present:   if field exists → _source = <source>
  #   key_value_set: if field == match_value → _source = <source>
  #   key_value_use: if field exists → _source = <field value>
  source_rules:
    - field: "_source"
      mode: "key_value_use"       # use the value of _source as the source
  default_source: "dfe"
  topic_suffix: "_land"
  legacy_compat: false  # also check tags.event.category / event_category
  # source_to_topic:
  #   auth: "logs_auth"
  dlq:
    enabled: true
    topic: "dlq_land"

destinations:
  default: "kafka"  # kafka or loader
  rules: []
  # rules:
  #   - match_field: "tags.destination"
  #     match_value: "direct"
  #     destination: "loader"

kafka:
  brokers:
    - "localhost:9092"
  client_id: "dfe-receiver"
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-512"
    username: ""
    password: ""
  tls:
    enabled: false
    ca_file: "/etc/ssl/kafka-ca.crt"
  producer:
    batch_size: 8388608      # 8MiB
    batch_messages: 10000
    linger_ms: 20
    compression: "zstd"
    acks: "all"
    retries: 5

loader:
  address: "dfe-loader:9000"
  transport: "kafka"  # kafka, zenoh, memory
  timeout_ms: 5000

buffer:
  memory_limit: 0  # 0 = auto-detect (67% available)
  pressure_threshold: 0.8
  spool_path: "/var/spool/dfe-receiver"
  spool_max_bytes: 10737418240  # 10GB

metrics:
  enabled: true
  address: "0.0.0.0:9090"
