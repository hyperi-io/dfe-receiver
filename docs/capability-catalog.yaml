- kind: source
  name: receiver
  description: 'Multi-protocol ingest receiver: accepts data over many wire protocols and routes to Kafka / the loader.'
  maturity: stable
  children:
  - kind: ingest
    name: http
    description: HTTP/JSON + NDJSON ingest (the ServerConfig endpoint).
    maturity: stable
  - kind: ingest
    name: grpc
    description: gRPC ingest (scalo Vector-compatible push service).
    maturity: stable
  - kind: ingest
    name: otlp
    description: OpenTelemetry OTLP logs/metrics/traces (feature-gated).
    maturity: stable
  - kind: ingest
    name: lumberjack
    description: Elastic Beats / Lumberjack v2 frames.
    maturity: stable
  - kind: ingest
    name: splunk_hec
    description: Splunk HTTP Event Collector.
    maturity: stable
  - kind: ingest
    name: syslog
    description: Syslog RFC3164/RFC5424 over TCP/UDP/TLS.
    maturity: stable
  - kind: ingest
    name: prometheus_rw
    description: Prometheus Remote Write.
    maturity: stable
  - kind: ingest
    name: fluent
    description: Fluent Forward protocol.
    maturity: stable
  - kind: ingest
    name: gelf
    description: Graylog Extended Log Format.
    maturity: stable
  - kind: ingest
    name: flow
    description: NetFlow v5/v9 + IPFIX + sFlow v5.
    maturity: stable
  - kind: ingest
    name: webhook
    description: 'Generic authenticated webhook intake: POST /webhook/{caller}, per-caller HMAC or static-header auth, per-caller topic.'
    maturity: stable
- kind: sink
  name: destinations
  description: 'The named destination set: a match rule sends accepted events to one destination or fans them out to several.'
  maturity: stable
  children:
  - kind: service
    name: kafka
    description: The bus, under the topic the event's source resolves to.
  - kind: service
    name: loader
    description: dfe-loader, over gRPC or the bus per the loader block.
  - kind: service
    name: grpc
    description: Any declared scalo Push listener -- a transform, the archiver -- by name.
  - kind: service
    name: file_sink
    description: Debug file sink (writes processed messages to a file).
