$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: Main configuration struct.
type: object
properties:
  server:
    description: HTTP server configuration.
    $ref: '#/$defs/ServerConfig'
    default:
      bind_address: 0.0.0.0:8080
      max_body_size: 10485760
      request_timeout_ms: 30000
      max_concurrent_requests: 10000
      rate_limit:
        enabled: false
        requests_per_second: 100
        burst: 500
      ip_filter:
        mode: disabled
        cidrs: []
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
  grpc:
    description: gRPC server configuration.
    $ref: '#/$defs/GrpcConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:6000
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
  otlp:
    description: OTLP receiver configuration.
    $ref: '#/$defs/OtlpConfig'
    default:
      enabled: false
      grpc_bind_address: 0.0.0.0:4317
      http_bind_address: 0.0.0.0:4318
      mode: hyperdx
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  lumberjack:
    description: Lumberjack v2 (Beats) receiver configuration.
    $ref: '#/$defs/LumberjackConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:5044
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
  splunk_hec:
    description: Splunk HEC receiver configuration.
    $ref: '#/$defs/SplunkHecConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:8088
      max_body_size: 10485760
      request_timeout_ms: 30000
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  syslog:
    description: Syslog receiver configuration.
    $ref: '#/$defs/SyslogConfig'
    default:
      enabled: false
      udp_bind_address: 0.0.0.0:514
      tcp_bind_address: 0.0.0.0:514
      tls_bind_address: 0.0.0.0:6514
      max_message_size: 65536
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  prometheus_rw:
    description: Prometheus Remote Write receiver configuration.
    $ref: '#/$defs/PrometheusRwConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:9091
      mode: native
      max_body_size: 10485760
      request_timeout_ms: 30000
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      auth:
        mode: none
        accepted_headers: []
        bearer:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
        include_common_header: true
        header_name: ''
        header_values: []
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  fluent:
    description: Fluent Forward protocol receiver configuration.
    $ref: '#/$defs/FluentConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:24224
      max_message_size: 33554432
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  gelf:
    description: GELF receiver configuration.
    $ref: '#/$defs/GelfConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0:12201
      max_message_size: 1048576
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  flow:
    description: Flow (NetFlow v5/v9 + IPFIX + sFlow v5) receiver configuration.
    $ref: '#/$defs/FlowConfig'
    default:
      enabled: false
      bind_address: 0.0.0.0
      ports:
      - 2055
      - 4739
      - 6343
      output:
        mode: canonical
        max_records_per_packet: 200
      channel_capacity: 4096
      recv_buffer_bytes: 8388608
      ip_filter: null
      rate_limit:
        enabled: false
        packets_per_second: 5000
        burst: 10000
        cache_size: 4096
      netflow:
        enabled: true
        template_cache:
          max_per_exporter: 1000
          max_exporters: 10000
        topic: netflow_land
      sflow:
        enabled: true
        topic: sflow_land
      split: null
      experimental: true
      raw_capture:
        enabled: null
        max_bytes: null
        on_oversize: null
  webhook:
    description: Generic authenticated webhook intake (`POST /webhook/{caller}`).
    $ref: '#/$defs/WebhookConfig'
    default:
      enabled: false
      bind_address: null
      max_body_size: 1048576
      request_timeout_ms: 10000
      tls:
        enabled: false
        cert_file: null
        key_file: null
        ca_file: null
        client_auth: none
        cert_secret: null
        key_secret: null
        ca_secret: null
        refresh_interval_secs: 3600
      callers: []
  raw_capture:
    description: |-
      Common raw-payload capture default, inherited by every transport that
      supports capture. Per-transport `raw_capture:` blocks override it
      field by field. See [`raw_capture`].
    $ref: '#/$defs/RawCaptureConfig'
    default:
      enabled: null
      max_bytes: null
      on_oversize: null
  validation:
    description: Validation rules.
    $ref: '#/$defs/ValidationConfig'
    default:
      require_json: true
      required_fields: []
      dlq_on_invalid: true
  routing:
    description: Routing configuration.
    $ref: '#/$defs/RoutingConfig'
    default:
      source_rules: []
      default_source: main
      topic_suffix: _land
      source_to_topic: {}
      legacy_compat: false
      dlq:
        enabled: true
        mode: cascade
        topic: dlq_land
        topic_suffix: .dlq
        file_enabled: true
        file_path: /var/spool/dfe/dlq
        kafka_enabled: true
  destinations:
    description: Destination configuration.
    $ref: '#/$defs/DestinationsConfig'
    default:
      default: kafka
      rules: []
  kafka:
    description: Kafka producer configuration.
    $ref: '#/$defs/KafkaConfig'
    default:
      brokers: []
      client_id: dfe-receiver
      sasl: null
      tls:
        enabled: false
        ca_file: null
        cert_file: null
        key_file: null
      producer:
        batch_size: 8388608
        batch_messages: 10000
        linger_ms: 20
        compression: lz4
        acks: all
        retries: 5
      librdkafka_overrides:
        statistics.interval.ms: '5000'
  loader:
    description: dfe-loader connection configuration.
    $ref: '#/$defs/LoaderConfig'
    default:
      address: dfe-loader:6000
      transport: kafka
      timeout_ms: 5000
      grpc_endpoint: null
  buffer:
    description: Buffer and memory configuration.
    $ref: '#/$defs/BufferConfig'
    default:
      memory_limit: 0
      pressure_threshold: 0.8
      spillover:
        enabled: false
        path: /var/spool/dfe-receiver
        max_usage_percent: 0.8
        poll_interval_secs: 5
  metrics:
    description: Metrics configuration.
    $ref: '#/$defs/MetricsConfig'
    default:
      enabled: true
      address: 0.0.0.0:9090
  scaling:
    description: Scaling pressure configuration for KEDA autoscaling.
    $ref: '#/$defs/ScalingConfig'
    default:
      enabled: true
      memory_gate_threshold: 0.8
      weight_request_rate: 0.3
      weight_queue_depth: 0.25
      weight_memory: 0.25
      weight_connections: 0.1
      weight_spill: 0.1
      saturation_request_rate: 100000.0
      saturation_queue_depth: 10000.0
      saturation_connections: 1000.0
      saturation_spill: 1000.0
  config_reload_secs:
    description: Periodic config reload interval in seconds (0 = disabled, SIGHUP only).
    type: integer
    format: uint64
    minimum: 0
    default: 0
  file_sink:
    description: Debug file sink -- writes all processed messages to a file.
    $ref: '#/$defs/FileSinkConfig'
    default:
      enabled: false
      path: /tmp/dfe-receiver-debug.ndjson
$defs:
  ServerConfig:
    description: HTTP server configuration.
    type: object
    properties:
      bind_address:
        description: Bind address (e.g., "0.0.0.0:443").
        type: string
        default: 0.0.0.0:8080
      max_body_size:
        description: Maximum request body size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 10485760
      request_timeout_ms:
        description: Request timeout in milliseconds.
        type: integer
        format: uint64
        minimum: 0
        default: 30000
      max_concurrent_requests:
        description: |-
          Maximum concurrent in-flight requests (0 = unlimited).
          Protects against connection exhaustion and memory pressure.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      rate_limit:
        description: Per-IP rate limiting for every HTTP listener.
        $ref: '#/$defs/RateLimitConfig'
        default:
          enabled: false
          requests_per_second: 100
          burst: 500
      ip_filter:
        description: |-
          IP filter (allowlist/denylist) for every listener the receiver owns an
          accept loop for.
        $ref: '#/$defs/IpFilterConfig'
        default:
          mode: disabled
          cidrs: []
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
  RateLimitConfig:
    description: |-
      Per-IP rate limiting configuration using GCRA (token bucket variant).

      Applies to `/ingest`, the webhook intake, Splunk HEC, Prometheus remote
      write and OTLP HTTP. Each listener keeps its own budget, so the figures
      below are per source IP per listener, not a receiver-wide total.

      It cannot apply to the raw TCP and UDP listeners (syslog, Lumberjack, Fluent
      Forward, GELF) or to the gRPC ports: there is no HTTP request there to count
      and tonic owns its own accept loop. Flow has its own per-source packet limit
      under `flow.rate_limit`.
    type: object
    properties:
      enabled:
        description: Enable per-IP rate limiting.
        type: boolean
        default: false
      requests_per_second:
        description: |-
          Maximum sustained requests per second per source IP.

          A rate, not an interval: the limiter replenishes one request of the
          quota every `1/requests_per_second` of a second. At 100 that is one
          every 10ms. Must be at least 1 while `enabled` is true.
        type: integer
        format: uint64
        minimum: 0
        default: 100
      burst:
        description: Burst capacity above the sustained rate.
        type: integer
        format: uint32
        minimum: 0
        default: 500
  IpFilterConfig:
    description: |-
      IP filter (allowlist / denylist) configuration.

      Enforced in the accept loop, before the TLS handshake and before any
      protocol work: `/ingest`, the webhook intake, Splunk HEC, Prometheus remote
      write, OTLP HTTP, syslog (UDP per datagram, TCP and TLS per connection),
      Lumberjack, Fluent Forward and GELF.

      It does not reach the gRPC ports (`grpc`, and OTLP on 4317): tonic owns
      those accept loops, so authenticate them with `auth.mode: bearer`, or
      `mtls` with `tls.client_auth: required`. Flow has its own optional
      `flow.ip_filter` per listener.

      UPGRADE: this list used to be `/ingest` and the webhook intake alone. One
      filter now governs every listener, so an allowlist written for the `/ingest`
      senders also decides which sources syslog, Lumberjack, Fluent Forward, GELF,
      Splunk HEC, Prometheus remote write and OTLP HTTP are accepted from. Widen
      `cidrs` to cover every sender, or those events are dropped in the accept
      loop.
    type: object
    properties:
      mode:
        description: 'Filter mode: "disabled", "allowlist", "denylist".'
        type: string
        default: disabled
      cidrs:
        description: CIDR ranges (e.g., `["10.0.0.0/8", "192.168.0.0/16"]`).
        type: array
        items:
          type: string
        default: []
  TlsConfig:
    description: TLS configuration.
    type: object
    properties:
      enabled:
        description: Enable TLS.
        type: boolean
        default: false
      cert_file:
        description: Path to certificate file (local file path).
        type:
        - string
        - 'null'
        default: null
      key_file:
        description: Path to private key file (local file path).
        type:
        - string
        - 'null'
        default: null
      ca_file:
        description: Path to CA certificate for client verification (mTLS).
        type:
        - string
        - 'null'
        default: null
      client_auth:
        description: Client certificate requirement (none, optional, required).
        type: string
        default: none
      cert_secret:
        description: |-
          Secret source for certificate (overrides cert_file).
          Format: "provider:path:key" (e.g., "vault:secret/tls:cert")
        type:
        - string
        - 'null'
        default: null
      key_secret:
        description: |-
          Secret source for private key (overrides key_file).
          Format: "provider:path:key" (e.g., "vault:secret/tls:key")
        type:
        - string
        - 'null'
        default: null
      ca_secret:
        description: |-
          Secret source for CA certificate (overrides ca_file).
          Format: "provider:path:key" (e.g., "vault:secret/tls:ca")
        type:
        - string
        - 'null'
        default: null
      refresh_interval_secs:
        description: |-
          Refresh interval for secrets in seconds.
          Default: 3600 (1 hour)
        type: integer
        format: uint64
        minimum: 0
        default: 3600
  AuthConfig:
    description: Authentication configuration.
    type: object
    properties:
      mode:
        description: Auth mode (none, header, bearer, mtls, both).
        type: string
        default: none
      accepted_headers:
        description: |-
          List of accepted headers (any one must match).
          Each entry defines a header name and its allowed values.
        type: array
        items:
          $ref: '#/$defs/AcceptedHeader'
        default: []
      bearer:
        description: Bearer token configuration.
        $ref: '#/$defs/BearerConfig'
        default:
          tokens: []
          secret_source: null
          refresh_interval_secs: 300
      include_common_header:
        description: |-
          Include the common `x-hyperi-agent` header in accepted headers.
          Also gates source rule evaluation and timestamp enrichment.
          Default: true
        type: boolean
        default: true
      header_name:
        description: |-
          Legacy: Single header name for header-based auth.
          Deprecated: Use `accepted_headers` instead.
        type: string
        default: ''
      header_values:
        description: |-
          Legacy: Allowed header values for single header.
          Deprecated: Use `accepted_headers` instead.
        type: array
        items:
          type: string
        default: []
  AcceptedHeader:
    description: Defines an accepted authentication header.
    type: object
    properties:
      name:
        description: Header name (e.g., "x-hyperi-agent", "Authorization").
        type: string
      values:
        description: |-
          Allowed values for this header.
          If empty, any non-empty value is accepted.
        type: array
        items:
          type: string
        default: []
    required:
    - name
  BearerConfig:
    description: Bearer token authentication configuration.
    type: object
    properties:
      tokens:
        description: |-
          Static tokens (for dev/simple deployments).
          In production, use `secret_source` instead.
        type: array
        items:
          type: string
        default: []
      secret_source:
        description: |-
          Secret source for dynamic token loading.
          Format: `provider:path[:key]` (e.g. "vault:secret/auth:bearer_tokens").
        type:
        - string
        - 'null'
        default: null
      refresh_interval_secs:
        description: |-
          Token refresh interval in seconds (for secret-sourced tokens).
          Default: 300 (5 minutes)
        type: integer
        format: uint64
        minimum: 0
        default: 300
  GrpcConfig:
    description: gRPC server configuration.
    type: object
    properties:
      enabled:
        description: Enable gRPC server.
        type: boolean
        default: false
      bind_address:
        description: Bind address for gRPC.
        type: string
        default: 0.0.0.0:6000
      tls:
        description: TLS configuration for gRPC server.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration for gRPC server.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
  OtlpConfig:
    description: OTLP (OpenTelemetry Protocol) receiver configuration.
    type: object
    properties:
      enabled:
        description: Enable OTLP receiver.
        type: boolean
        default: false
      grpc_bind_address:
        description: Bind address for OTLP gRPC (standard port 4317).
        type: string
        default: 0.0.0.0:4317
      http_bind_address:
        description: Bind address for OTLP HTTP (standard port 4318).
        type: string
        default: 0.0.0.0:4318
      mode:
        description: |-
          Conversion mode: "hyperdx" (default) or "generic".

          - `hyperdx`: JSON matching the OTel ClickHouse exporter schema
            for direct HyperDX compatibility.
          - `generic`: Normalised JSON envelope with routing fields.
        type: string
        default: hyperdx
      tls:
        description: TLS configuration for OTLP endpoints.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration for OTLP endpoints.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
      raw_capture:
        description: |-
          Raw-payload capture override (inherits the common `raw_capture` block).

          OTLP arrives as protobuf, so `_raw` carries the `generic`-mode
          rendering of the record -- the least-shaped decode we produce. In
          `generic` mode it is therefore a copy of the event itself.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  RawCaptureConfig:
    description: |-
      Raw-capture settings as written in config, at either cascade level.

      Every field is `Option` so an unset field means "inherit", not "off".
    type: object
    properties:
      enabled:
        description: Capture the original payload into `_raw`.
        type:
        - boolean
        - 'null'
        default: null
      max_bytes:
        description: Maximum captured bytes; 0 means unlimited.
        type:
        - integer
        - 'null'
        format: uint
        minimum: 0
        default: null
      on_oversize:
        description: Behaviour when the payload exceeds `max_bytes`.
        anyOf:
        - $ref: '#/$defs/OversizePolicy'
        - type: 'null'
        default: null
  OversizePolicy:
    description: What to do with a payload larger than `max_bytes`.
    oneOf:
    - description: 'Keep the leading `max_bytes` and flag it with `_raw_truncated: true`.'
      type: string
      const: truncate
    - description: Emit no `_raw` at all for this event.
      type: string
      const: omit
  LumberjackConfig:
    description: |-
      Lumberjack v2 (Beats) protocol configuration.

      Accepts data from Elastic Beats agents (Filebeat, Winlogbeat, etc.)
      over the Lumberjack v2 wire protocol on TCP/TLS.
    type: object
    properties:
      enabled:
        description: Enable Lumberjack/Beats receiver.
        type: boolean
        default: false
      bind_address:
        description: Bind address for Lumberjack TCP listener (standard port 5044).
        type: string
        default: 0.0.0.0:5044
      tls:
        description: TLS configuration (Beats clients typically require TLS).
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
  SplunkHecConfig:
    description: |-
      Splunk HEC (HTTP Event Collector) receiver configuration.

      Accepts data from Splunk forwarders and HTTP clients over the HEC protocol.
      Supports both `Authorization: Splunk <token>` and `Authorization: Bearer <token>`.
    type: object
    properties:
      enabled:
        description: Enable Splunk HEC receiver.
        type: boolean
        default: false
      bind_address:
        description: Bind address for Splunk HEC HTTP listener (standard port 8088).
        type: string
        default: 0.0.0.0:8088
      max_body_size:
        description: Maximum request body size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 10485760
      request_timeout_ms:
        description: Request timeout in milliseconds.
        type: integer
        format: uint64
        minimum: 0
        default: 30000
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
      raw_capture:
        description: |-
          Raw-payload capture override (inherits the common `raw_capture` block).

          On `/services/collector/event`, `_raw` carries the submitted `event`
          value before HEC metadata is merged in. On `/services/collector/raw`
          it carries the original line bytes.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  SyslogConfig:
    description: |-
      Syslog receiver configuration (RFC 5424 + RFC 3164).

      Accepts syslog messages over UDP, TCP, and TLS/TCP.
      Auto-detects message format (RFC 5424 vs RFC 3164) per message.
    type: object
    properties:
      enabled:
        description: Enable syslog receiver.
        type: boolean
        default: false
      udp_bind_address:
        description: Bind address for UDP listener (standard port 514).
        type: string
        default: 0.0.0.0:514
      tcp_bind_address:
        description: Bind address for TCP listener (standard port 514).
        type: string
        default: 0.0.0.0:514
      tls_bind_address:
        description: Bind address for TLS/TCP listener (standard port 6514, RFC 5425).
        type: string
        default: 0.0.0.0:6514
      max_message_size:
        description: Maximum syslog message size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 65536
      tls:
        description: TLS configuration (for secure syslog on port 6514).
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
      raw_capture:
        description: |-
          Raw-payload capture override (inherits the common `raw_capture` block).

          The strongest case for capture: `_raw` holds the wire line including
          the PRI and header, none of which survives into the parsed envelope.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  PrometheusRwConfig:
    description: Prometheus Remote Write receiver configuration.
    type: object
    properties:
      enabled:
        description: Enable Prometheus Remote Write receiver.
        type: boolean
        default: false
      bind_address:
        description: Bind address for HTTP listener.
        type: string
        default: 0.0.0.0:9091
      mode:
        description: |-
          Output mode: "native" (default), "otel", or "hyperdx".
          - `native`: Flat JSON with labels as top-level fields.
          - `otel`: Generic OTel JSON envelope (snake_case, RFC 3339).
          - `hyperdx`: HyperDX ClickHouse-compatible JSON (PascalCase, DateTime64).
        type: string
        default: native
      max_body_size:
        description: Maximum request body size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 10485760
      request_timeout_ms:
        description: Request timeout in milliseconds.
        type: integer
        format: uint64
        minimum: 0
        default: 30000
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      auth:
        description: Authentication configuration.
        $ref: '#/$defs/AuthConfig'
        default:
          mode: none
          accepted_headers: []
          bearer:
            tokens: []
            secret_source: null
            refresh_interval_secs: 300
          include_common_header: true
          header_name: ''
          header_values: []
      raw_capture:
        description: |-
          Raw-payload capture override (inherits the common `raw_capture` block).

          Remote Write arrives as snappy-framed protobuf, so `_raw` carries the
          `native`-mode rendering of the sample -- the least-shaped decode we
          produce. In `native` mode it is therefore a copy of the event itself.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  FluentConfig:
    description: |-
      Fluent Forward protocol configuration.

      Accepts data from Fluentd and Fluent Bit agents over the Forward
      protocol (msgpack over TCP) on the standard port 24224.

      There is no `auth` block: the Forward frames this handler reads carry no
      credential. Close the port at the handshake with `tls.client_auth:
      required`, or restrict the senders with a `server.ip_filter` allowlist.
    type: object
    properties:
      enabled:
        description: Enable Fluent Forward receiver.
        type: boolean
        default: false
      bind_address:
        description: Bind address for TCP listener (standard port 24224).
        type: string
        default: 0.0.0.0:24224
      max_message_size:
        description: Maximum message size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 33554432
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      raw_capture:
        description: |-
          Raw-payload capture override (inherits the common `raw_capture` block).

          Forward arrives as msgpack, so `_raw` carries the record's verbatim
          msgpack-to-JSON decode, before the tag, timestamp and `_source` this
          handler adds.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  GelfConfig:
    description: |-
      GELF (Graylog Extended Log Format) receiver configuration.

      Accepts GELF messages over TCP (null-byte delimited JSON)
      on the standard port 12201.

      There is no `auth` block: GELF has no in-protocol authentication. Close the
      port at the handshake with `tls.client_auth: required`, or restrict the
      senders with a `server.ip_filter` allowlist.
    type: object
    properties:
      enabled:
        description: Enable GELF receiver.
        type: boolean
        default: false
      bind_address:
        description: Bind address for TCP listener (standard port 12201).
        type: string
        default: 0.0.0.0:12201
      max_message_size:
        description: Maximum message size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 1048576
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      raw_capture:
        description: |-
          Raw-payload capture override (inherits the common `raw_capture` block).

          `_raw` holds the GELF message exactly as it arrived, before the
          `message`, `severity` and `_source` fields this handler derives.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  FlowConfig:
    description: |-
      Unified-mode listener config -- one block applies to all decoders on
      configured ports.
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      bind_address:
        type: string
        format: ip
        default: 0.0.0.0
      ports:
        type: array
        items:
          type: integer
          format: uint16
          minimum: 0
          maximum: 65535
        default:
        - 2055
        - 4739
        - 6343
      output:
        $ref: '#/$defs/FlowOutputConfig'
        default:
          mode: canonical
          max_records_per_packet: 200
      channel_capacity:
        type: integer
        format: uint
        minimum: 0
        default: 4096
      recv_buffer_bytes:
        type: integer
        format: uint
        minimum: 0
        default: 8388608
      ip_filter:
        anyOf:
        - $ref: '#/$defs/IpFilterConfig'
        - type: 'null'
      rate_limit:
        $ref: '#/$defs/RateLimitConfig2'
        default:
          enabled: false
          packets_per_second: 5000
          burst: 10000
          cache_size: 4096
      netflow:
        $ref: '#/$defs/NetflowSubConfig'
        default:
          enabled: true
          template_cache:
            max_per_exporter: 1000
            max_exporters: 10000
          topic: netflow_land
      sflow:
        $ref: '#/$defs/SflowSubConfig'
        default:
          enabled: true
          topic: sflow_land
      split:
        description: If present, switches to split mode and `flow.enabled` MUST be false.
        anyOf:
        - $ref: '#/$defs/FlowSplitConfig'
        - type: 'null'
      experimental:
        description: |-
          EXPERIMENTAL marker. When true (default), the handler emits a startup
          WARN log and sets `dfe_handler_experimental{handler="flow"} 1`.
          Flipped to false in a follow-up PR after stability period.
        type: boolean
        default: true
      raw_capture:
        description: |-
          Raw-record capture override (inherits the common `raw_capture` block).

          `_raw` carries the decoder's verbatim record rendering: a JSON array
          of every record in `canonical` mode, the single record in `exploded`.
        $ref: '#/$defs/RawCaptureConfig'
        default:
          enabled: null
          max_bytes: null
          on_oversize: null
  FlowOutputConfig:
    type: object
    properties:
      mode:
        $ref: '#/$defs/OutputMode'
        default: canonical
      max_records_per_packet:
        type: integer
        format: uint
        minimum: 0
        default: 200
  OutputMode:
    description: |-
      Shape of the emitted event: one per packet, or one per flow record.

      Raw record retention is no longer a mode. It is
      `flow.raw_capture.enabled`, which composes with either shape and writes
      the common-header `_raw` field like every other transport.
    type: string
    enum:
    - canonical
    - exploded
  RateLimitConfig2:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      packets_per_second:
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      burst:
        type: integer
        format: uint32
        minimum: 0
        default: 10000
      cache_size:
        type: integer
        format: uint
        minimum: 0
        default: 4096
  NetflowSubConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      template_cache:
        $ref: '#/$defs/TemplateCacheConfig'
        default:
          max_per_exporter: 1000
          max_exporters: 10000
      topic:
        type: string
        default: netflow_land
  TemplateCacheConfig:
    type: object
    properties:
      max_per_exporter:
        type: integer
        format: uint
        minimum: 0
        default: 1000
      max_exporters:
        type: integer
        format: uint
        minimum: 0
        default: 10000
  SflowSubConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      topic:
        type: string
        default: sflow_land
  FlowSplitConfig:
    type: object
    properties:
      netflow:
        $ref: '#/$defs/FlowListenerConfig'
      sflow:
        $ref: '#/$defs/FlowListenerConfig'
    required:
    - netflow
    - sflow
  FlowListenerConfig:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      bind_address:
        type: string
        format: ip
        default: 0.0.0.0
      ports:
        type: array
        items:
          type: integer
          format: uint16
          minimum: 0
          maximum: 65535
      output:
        $ref: '#/$defs/FlowOutputConfig'
        default:
          mode: canonical
          max_records_per_packet: 200
      channel_capacity:
        type: integer
        format: uint
        minimum: 0
        default: 4096
      recv_buffer_bytes:
        type: integer
        format: uint
        minimum: 0
        default: 8388608
      ip_filter:
        anyOf:
        - $ref: '#/$defs/IpFilterConfig'
        - type: 'null'
      rate_limit:
        $ref: '#/$defs/RateLimitConfig2'
        default:
          enabled: false
          packets_per_second: 5000
          burst: 10000
          cache_size: 4096
      template_cache:
        $ref: '#/$defs/TemplateCacheConfig'
        default:
          max_per_exporter: 1000
          max_exporters: 10000
      topic:
        type: string
    required:
    - ports
    - topic
  WebhookConfig:
    description: |-
      Generic authenticated webhook intake.

      One `POST /webhook/{caller}` route per declared caller. Each caller is a
      product that pushes events (an alert rule, a SaaS notification hook) and
      carries its own secret, its own topic and its own body shape, so callers
      never share a credential and a wrong secret is only ever tried against the
      caller the path names.

      With `bind_address` unset the routes are served on the main ingest listener
      under `server.tls`, `server.ip_filter` and `server.rate_limit`. Set it and
      the intake gets its own listener under `webhook.tls`, so a deployment can
      expose only this port to a product's egress and keep `/ingest` internal;
      `server.ip_filter`, `server.rate_limit` and `server.max_concurrent_requests`
      still apply to it.
    type: object
    properties:
      enabled:
        description: Enable the webhook intake.
        type: boolean
        default: false
      bind_address:
        description: Own listener address. Unset shares the main ingest listener.
        type:
        - string
        - 'null'
        default: null
      max_body_size:
        description: |-
          Maximum request body size in bytes. Alerts are small; agents that post
          bulk data use `/ingest`, so this is deliberately far below
          `server.max_body_size`.
        type: integer
        format: uint
        minimum: 0
        default: 1048576
      request_timeout_ms:
        description: Request timeout in milliseconds (own listener only).
        type: integer
        format: uint64
        minimum: 0
        default: 10000
      tls:
        description: |-
          TLS for the own listener. Refused when `bind_address` is unset, since
          the shared listener is under `server.tls`.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          cert_file: null
          key_file: null
          ca_file: null
          client_auth: none
          cert_secret: null
          key_secret: null
          ca_secret: null
          refresh_interval_secs: 3600
      callers:
        description: The callers, one entry per product.
        type: array
        items:
          $ref: '#/$defs/WebhookCallerConfig'
        default: []
  WebhookCallerConfig:
    description: 'One webhook caller: a product identity, its secret, its topic.'
    type: object
    properties:
      name:
        description: |-
          The path segment (`POST /webhook/{name}`) and the `_source` stamped on
          every record. Lowercase letters, digits, `_` and `-` only.
        type: string
        default: ''
      topic:
        description: |-
          Kafka topic the caller's records land on, verbatim -- no
          `routing.topic_suffix` is applied.
        type: string
        default: ''
      auth:
        description: How the caller authenticates.
        $ref: '#/$defs/WebhookAuthConfig'
        default:
          mode: hmac
          secret_source: ''
          refresh_interval_secs: 300
          header: x-signature
          timestamp_header: x-timestamp
          tolerance_secs: 300
      body:
        description: Whether a body is one record or a JSON array of records.
        $ref: '#/$defs/WebhookBody'
        default: single
      filter:
        description: |-
          Optional CEL expression over the record; a false result drops it. An
          empty string keeps every record. Compiled once at load.
        type: string
        default: ''
  WebhookAuthConfig:
    description: |-
      Per-caller authentication.

      `hmac` is the strong mode: the product signs `"{timestamp}.{body}"` with
      HMAC-SHA256 and the timestamp must be within `tolerance_secs` of the
      receiver's clock, so a captured request cannot be replayed later. `header`
      is for products that can only attach static headers to a webhook (runZero
      alert rules are one): the named header carries a shared secret compared as
      a SHA-256 hash, exactly as bearer tokens are. It has no integrity or replay
      protection, which is why it is opt-in per caller rather than the default.
    type: object
    properties:
      mode:
        description: '`hmac` or `header`.'
        $ref: '#/$defs/WebhookAuthMode'
        default: hmac
      secret_source:
        description: |-
          Where the secret lives: `provider:path[:key]` as for bearer tokens
          (`file:`, `vault:` / `bao:` / `openbao:`, `env:`). Required. There is no
          static secret field on purpose: a secret in YAML surfaces in the
          config-schema dump and in every `config-check`.
        type: string
        default: ''
      refresh_interval_secs:
        description: Refresh interval for the secret in seconds.
        type: integer
        format: uint64
        minimum: 0
        default: 300
      header:
        description: |-
          `hmac`: the header carrying the signature (`sha256=<hex>` or bare
          hex). `header`: the header carrying the shared secret.
        type: string
        default: x-signature
      timestamp_header:
        description: |-
          `hmac` only: the header carrying the unix-seconds timestamp that was
          signed with the body.
        type: string
        default: x-timestamp
      tolerance_secs:
        description: |-
          `hmac` only: how far the signed timestamp may be from the receiver's
          clock, in seconds, in either direction.
        type: integer
        format: uint64
        minimum: 0
        default: 300
  WebhookAuthMode:
    description: The two ways a webhook caller can prove itself.
    oneOf:
    - description: HMAC-SHA256 over `"{timestamp}.{body}"`, with a replay window.
      type: string
      const: hmac
    - description: A static header carrying a shared secret.
      type: string
      const: header
  WebhookBody:
    description: What one POST body holds.
    oneOf:
    - description: One JSON object, one record.
      type: string
      const: single
    - description: A JSON array; every element is a record.
      type: string
      const: array
  ValidationConfig:
    description: Validation configuration.
    type: object
    properties:
      require_json:
        description: Require JSON format.
        type: boolean
        default: true
      required_fields:
        description: Required fields (reject if missing).
        type: array
        items:
          type: string
        default: []
      dlq_on_invalid:
        description: Send invalid messages to DLQ instead of rejecting.
        type: boolean
        default: true
  RoutingConfig:
    description: Routing configuration.
    type: object
    properties:
      source_rules:
        description: |-
          Rules for determining `_source` value (first match wins).
          Only evaluated when `include_common_header` is true.
        type: array
        items:
          $ref: '#/$defs/SourceRule'
        default: []
      default_source:
        description: Default source when no rule matches.
        type: string
        default: main
      topic_suffix:
        description: Suffix appended to source to form topic name.
        type: string
        default: _land
      source_to_topic:
        description: Source-to-topic remapping (optional).
        type: object
        additionalProperties:
          type: string
        default: {}
      legacy_compat:
        description: |-
          Enable pre-2.2 compatibility.
          Appends `key_value_use` rules for `tags.event.category` and `event_category`.
        type: boolean
        default: false
      dlq:
        description: DLQ configuration.
        $ref: '#/$defs/DlqConfig'
        default:
          enabled: true
          mode: cascade
          topic: dlq_land
          topic_suffix: .dlq
          file_enabled: true
          file_path: /var/spool/dfe/dlq
          kafka_enabled: true
  SourceRule:
    description: Rule for determining `_source` value from JSON payload.
    type: object
    properties:
      field:
        description: JSON field path (dot notation for nested, e.g., "tags.event.category").
        type: string
      mode:
        description: |-
          Match mode: "key_present", "key_value_set", "key_value_use".

          - `key_present`: if field exists -> `_source = source`
          - `key_value_set`: if field value == `match_value` -> `_source = source`
          - `key_value_use`: if field exists -> `_source = <field value>`
        type: string
      match_value:
        description: Value to match against (for `key_value_set` mode only).
        type:
        - string
        - 'null'
        default: null
      source:
        description: |-
          Source value to set (for `key_present` and `key_value_set` modes).
          Ignored for `key_value_use` (uses the field value directly).
        type:
        - string
        - 'null'
        default: null
    required:
    - field
    - mode
  DlqConfig:
    description: DLQ (Dead Letter Queue) configuration.
    type: object
    properties:
      enabled:
        description: Enable DLQ.
        type: boolean
        default: true
      mode:
        description: 'Backend mode: cascade (default), fan_out, file_only, kafka_only.'
        type: string
        default: cascade
      topic:
        description: |-
          DLQ topic name: when non-empty, every Kafka DLQ write routes here
          (routing=common). Empty selects per-destination `{dest}{topic_suffix}`
          routing -- reachable via config file only (flat-env drops empty values).
        type: string
        default: dlq_land
      topic_suffix:
        description: Topic suffix for per-table routing.
        type: string
        default: .dlq
      file_enabled:
        description: File backend settings.
        type: boolean
        default: true
      file_path:
        type: string
        default: /var/spool/dfe/dlq
      kafka_enabled:
        description: Kafka backend settings.
        type: boolean
        default: true
  DestinationsConfig:
    description: |-
      The named destination set: where a matched record goes.

      `kafka` and `loader` are always available without being declared -- the bus
      (the record's own topic) and the app named by the `loader` block. Any other
      name is declared here as a sibling key, so a match rule can send a record to
      a transform's Push listener, or fan it out to several destinations at once:

      ```yaml
      destinations:
        default: loader
        rules:
          - match_field: app
            match_value: orders
            destination: [transform-orders, archiver]
        transform-orders:
          grpc:
            endpoint: "http://dfe-transform-orders:6000"
        archiver:
          grpc:
            endpoint: "http://dfe-archiver:6000"
      ```
    type: object
    properties:
      default:
        description: Destination for records no rule matches.
        $ref: '#/$defs/DestinationRef'
        default: kafka
      rules:
        description: Routing rules for destination selection (first match wins).
        type: array
        items:
          $ref: '#/$defs/DestinationRule'
        default: []
    additionalProperties:
      $ref: '#/$defs/DestinationSpec'
  DestinationRef:
    description: |-
      One destination name, or a list of them to fan a matched record out to.

      A fan-out is delivered when every destination has accepted it.
    anyOf:
    - description: A single destination name.
      type: string
    - description: Several destination names -- the record goes to all of them.
      type: array
      items:
        type: string
  DestinationRule:
    description: Destination routing rule.
    type: object
    properties:
      match_field:
        description: Field to match.
        type: string
      match_value:
        description: Value to match.
        type: string
      destination:
        description: 'Destination for matched messages: one name, or a list to fan out.'
        $ref: '#/$defs/DestinationRef'
    required:
    - match_field
    - match_value
    - destination
  DestinationSpec:
    description: 'A declared destination: exactly one transport block.'
    type: object
    properties:
      grpc:
        description: |-
          Deliver over gRPC to a scalo Push listener (a transform, the loader, the
          archiver).
        anyOf:
        - $ref: '#/$defs/GrpcDestination'
        - type: 'null'
        default: null
      kafka:
        description: Deliver over the bus.
        anyOf:
        - $ref: '#/$defs/KafkaDestination'
        - type: 'null'
        default: null
  GrpcDestination:
    description: A gRPC destination -- the address of a scalo Push listener.
    type: object
    properties:
      endpoint:
        description: Endpoint URI, e.g. `http://dfe-transform-orders:6000`.
        type: string
    required:
    - endpoint
  KafkaDestination:
    description: A bus destination.
    type: object
    properties:
      topic:
        description: |-
          Fixed topic for this destination. Unset means the topic the record's
          source resolves to, which is what the built-in `kafka` destination does.
        type:
        - string
        - 'null'
        default: null
  KafkaConfig:
    description: Kafka producer configuration.
    type: object
    properties:
      brokers:
        description: Broker addresses.
        type: array
        items:
          type: string
        default: []
      client_id:
        description: Client ID.
        type: string
        default: dfe-receiver
      sasl:
        description: SASL configuration.
        anyOf:
        - $ref: '#/$defs/SaslConfig'
        - type: 'null'
        default: null
      tls:
        description: TLS configuration.
        $ref: '#/$defs/KafkaTlsConfig'
        default:
          enabled: false
          ca_file: null
          cert_file: null
          key_file: null
      producer:
        description: Producer-specific settings.
        $ref: '#/$defs/ProducerConfig'
        default:
          batch_size: 8388608
          batch_messages: 10000
          linger_ms: 20
          compression: lz4
          acks: all
          retries: 5
      librdkafka_overrides:
        description: Raw librdkafka configuration overrides (highest priority).
        type: object
        additionalProperties:
          type: string
        default:
          statistics.interval.ms: '5000'
  SaslConfig:
    description: SASL authentication configuration.
    type: object
    properties:
      enabled:
        description: Enable SASL.
        type: boolean
      mechanism:
        description: SASL mechanism (plain, scram_sha_256, scram_sha_512).
        type: string
      username:
        description: Username.
        type: string
      password:
        description: Password (redacted in Debug/Display output).
        type: string
    required:
    - enabled
    - mechanism
    - username
    - password
  KafkaTlsConfig:
    description: Kafka TLS configuration.
    type: object
    properties:
      enabled:
        description: Enable TLS for Kafka.
        type: boolean
        default: false
      ca_file:
        description: CA certificate file.
        type:
        - string
        - 'null'
        default: null
      cert_file:
        description: Client certificate file.
        type:
        - string
        - 'null'
        default: null
      key_file:
        description: Client key file.
        type:
        - string
        - 'null'
        default: null
  ProducerConfig:
    description: Kafka producer settings.
    type: object
    properties:
      batch_size:
        description: Maximum batch size in bytes.
        type: integer
        format: uint
        minimum: 0
        default: 8388608
      batch_messages:
        description: Maximum messages per batch.
        type: integer
        format: uint
        minimum: 0
        default: 10000
      linger_ms:
        description: Linger time in milliseconds.
        type: integer
        format: uint32
        minimum: 0
        default: 20
      compression:
        description: Compression type (none, gzip, snappy, lz4, zstd).
        type: string
        default: lz4
      acks:
        description: Acknowledgment level (0, 1, all).
        type: string
        default: all
      retries:
        description: Number of retries.
        type: integer
        format: uint32
        minimum: 0
        default: 5
  LoaderConfig:
    description: dfe-loader connection configuration.
    type: object
    properties:
      address:
        description: |-
          Loader address, the manifest's `endpoints.push` port (apps.yaml).
          Override with grpc_endpoint to dial a different URI.
        type: string
        default: dfe-loader:6000
      transport:
        description: Transport type (kafka, grpc; `memory` discards and is refused at startup).
        type: string
        default: kafka
      timeout_ms:
        description: Per-RPC deadline for the gRPC loader client, in milliseconds (0 = none).
        type: integer
        format: uint64
        minimum: 0
        default: 5000
      grpc_endpoint:
        description: |-
          gRPC endpoint URI for loader (only used when transport = "grpc").
          Defaults to http://{address} if not set.
        type:
        - string
        - 'null'
        default: null
  BufferConfig:
    description: |-
      Buffer and memory configuration.

      ## Design Decision: No Disk Spillover

      Memory-only buffering is used because:
      1. K8s memory limits trigger OOMKill, which triggers KEDA scale-up
      2. Vector clients have their own disk buffers for retries
      3. Circuit breaker + 503 responses propagate backpressure upstream
      4. Disk I/O would bottleneck the hot path at PB/s scale
    type: object
    properties:
      memory_limit:
        description: |-
          Maximum memory for buffers in bytes (0 = scalo's MemoryGuard auto-detect:
          85% of the cgroup limit, capped at cgroup v2 `memory.high` when that is
          lower, and total system memory when there is no cgroup).
        type: integer
        format: uint
        minimum: 0
        default: 0
      pressure_threshold:
        description: |-
          Memory pressure threshold (0.0-1.0).
          When usage exceeds this, backpressure is applied (503 responses).
        type: number
        format: double
        default: 0.8
      spillover:
        description: |-
          Optional disk spillover configuration.
          When enabled, messages are spilled to disk via scalo's TieredSink
          when the primary sink is unavailable (instead of in-memory only).
        $ref: '#/$defs/SpilloverConfig'
        default:
          enabled: false
          path: /var/spool/dfe-receiver
          max_usage_percent: 0.8
          poll_interval_secs: 5
  SpilloverConfig:
    description: |-
      Disk spillover configuration (opt-in, default disabled).

      When enabled, failed sends are spilled to disk via scalo's TieredSink
      instead of being held in an in-memory queue. This provides crash-resilient
      buffering at the cost of disk I/O on the failure path.
    type: object
    properties:
      enabled:
        description: 'Enable disk spillover (default: false).'
        type: boolean
        default: false
      path:
        description: Directory for spool files.
        type: string
        default: /var/spool/dfe-receiver
      max_usage_percent:
        description: Maximum filesystem usage percentage (0.0-1.0) before pausing spool writes.
        type: number
        format: double
        default: 0.8
      poll_interval_secs:
        description: How often to check disk usage, in seconds.
        type: integer
        format: uint64
        minimum: 0
        default: 5
  MetricsConfig:
    description: Metrics configuration.
    type: object
    properties:
      enabled:
        description: Enable metrics.
        type: boolean
        default: true
      address:
        description: Metrics server address.
        type: string
        default: 0.0.0.0:9090
  ScalingConfig:
    description: |-
      Scaling pressure configuration for KEDA autoscaling.

      Configures the weighted composite metric that KEDA uses to scale the receiver.
      Each component has a weight (relative importance) and saturation point (value
      at which it contributes its full weight to the composite).
    type: object
    properties:
      enabled:
        description: Enable scaling pressure calculation.
        type: boolean
        default: true
      memory_gate_threshold:
        description: Memory usage ratio that triggers the memory gate (0.0-1.0).
        type: number
        format: double
        default: 0.8
      weight_request_rate:
        description: Weight for request rate component (default 0.30).
        type: number
        format: double
        default: 0.3
      weight_queue_depth:
        description: Weight for queue depth component (default 0.25).
        type: number
        format: double
        default: 0.25
      weight_memory:
        description: Weight for memory component (default 0.25).
        type: number
        format: double
        default: 0.25
      weight_connections:
        description: Weight for active connections component (default 0.10).
        type: number
        format: double
        default: 0.1
      weight_spill:
        description: Weight for spilled messages component (default 0.10).
        type: number
        format: double
        default: 0.1
      saturation_request_rate:
        description: Saturation point for request rate (req/s).
        type: number
        format: double
        default: 100000.0
      saturation_queue_depth:
        description: Saturation point for queue depth (messages).
        type: number
        format: double
        default: 10000.0
      saturation_connections:
        description: Saturation point for active connections.
        type: number
        format: double
        default: 1000.0
      saturation_spill:
        description: Saturation point for spilled messages.
        type: number
        format: double
        default: 1000.0
  FileSinkConfig:
    description: Debug file sink configuration.
    type: object
    properties:
      enabled:
        description: Enable writing all processed messages to a file.
        type: boolean
        default: false
      path:
        description: Path to the output file (NDJSON format, appended).
        type: string
        default: /tmp/dfe-receiver-debug.ndjson
