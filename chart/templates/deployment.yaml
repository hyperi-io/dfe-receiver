apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-receiver.fullname" . }}
  labels:
    {{- include "dfe-receiver.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.keda.enabled .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dfe-receiver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dfe-receiver.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dfe-receiver.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--config"
            - "/etc/dfe-receiver/config.yaml"
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 6000
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: beats
              containerPort: 5044
              protocol: TCP
            - name: hec
              containerPort: 8088
              protocol: TCP
            - name: prometheus-rw
              containerPort: 9091
              protocol: TCP
            - name: syslog
              containerPort: 514
              protocol: TCP
            - name: syslog-tls
              containerPort: 6514
              protocol: TCP
            - name: fluent
              containerPort: 24224
              protocol: TCP
            - name: gelf
              containerPort: 12201
              protocol: TCP
            - name: netflow
              containerPort: 2055
              protocol: UDP
            - name: netflow-ipfix
              containerPort: 4739
              protocol: UDP
            - name: sflow
              containerPort: 6343
              protocol: UDP
          env:
            - name: OTEL_SERVICE_NAME
              value: "dfe-receiver"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME)
            {{- if (.Values.otel).endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            {{- end }}
            # kafka credentials via Secret (figment env cascade overrides file config)
            - name: DFE_RECEIVER_KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-receiver.kafkaSecretName" . }}
                  key: {{ .Values.kafka.secretKeys.username }}
            - name: DFE_RECEIVER_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-receiver.kafkaSecretName" . }}
                  key: {{ .Values.kafka.secretKeys.password }}
            # auth credentials via Secret (figment env cascade overrides file config)
            - name: DFE_RECEIVER__SERVER__AUTH__BEARER__TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-receiver.authSecretName" . }}
                  key: {{ (index .Values.auth.secretKeys "bearer-tokens") }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/dfe-receiver
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-receiver.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
