# dfe-receiver Helm chart values
#
# Generated by hyperi-rustlib deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-receiver
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe-receiver/config.yaml)
config:
  grpc:
    bind_address: 0.0.0.0:6000
    enabled: false
  kafka:
    brokers:
    - kafka:9092
    client_id: dfe-receiver
    producer:
      acks: all
      compression: zstd
  lumberjack:
    bind_address: 0.0.0.0:5044
    enabled: false
  metrics:
    address: 0.0.0.0:9090
    enabled: true
  otlp:
    enabled: false
    grpc_bind_address: 0.0.0.0:4317
    http_bind_address: 0.0.0.0:4318
    mode: hyperdx
  routing:
    default_source: default
    topic_suffix: _land
  server:
    auth:
      mode: none
    bind_address: 0.0.0.0:8080
    max_body_size: 10485760
    request_timeout_ms: 30000
  splunk_hec:
    bind_address: 0.0.0.0:8088
    enabled: false
  flow:
    enabled: false
    experimental: true
    bind_address: 0.0.0.0
    ports:
      - 2055
      - 4739
      - 6343
    output:
      mode: canonical
      max_records_per_packet: 200
    channel_capacity: 4096
    recv_buffer_bytes: 8388608
    rate_limit:
      enabled: false
      packets_per_second: 5000
      burst: 10000
      cache_size: 4096
    netflow:
      enabled: true
      template_cache:
        max_per_exporter: 1000
        max_exporters: 10000
      topic: netflow_land
    sflow:
      enabled: true
      topic: sflow_land

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- auth credentials
auth:
  existingSecret: ""
  secretKeys:
    bearer-tokens: bearer-tokens
  bearer-tokens: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 120
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "10000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config)
    topic: ""
    # -- Override consumer group (default: from config)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"
  prometheus:
    # -- Enable Prometheus-based scaling on the app's scaling-pressure signal.
    # OPT-IN: Kafka + CPU triggers above are the defaults. Turn this on to scale
    # on the rustlib horizontal scaling-pressure ENGINE's correlated composite.
    enabled: false
    # -- Prometheus server address. CLUSTER-SPECIFIC: point at your in-cluster
    # Prometheus / Thanos query endpoint (the default below is a placeholder).
    serverAddress: "http://prometheus:9090"
    # -- PromQL query for the scale decision. The receiver is a PUSH ORIGINATOR
    # (inbound HTTP/gRPC/syslog), so its engine smart-default composite is
    # max(CPU/cpu_target, in-flight/concurrency_target) gated by the outbound
    # Kafka circuit. Use the engine gauge (preferred):
    #   avg(dfe_receiver_scaling_pressure{name="default"})
    # The legacy weighted gauge `avg(dfe_scaling_pressure)` (0-100) is retained
    # and used as the default here for backward compatibility. To scale on raw
    # per-pod in-flight directly (Tier-1, no engine), use:
    #   avg(dfe_receiver_active_connections)   # with metricType Value
    query: "avg(dfe_scaling_pressure)"
    # -- Threshold value (0-100) to trigger scale-up
    threshold: "70"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
