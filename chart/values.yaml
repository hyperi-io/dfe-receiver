# dfe-receiver Helm chart values
#
# Generated by scalo deployment module.
# Contract points validated by cargo test.

# -- Number of replicas, ignored while a KEDA ScaledObject or the HPA
# fallback renders, because that then owns the replica count.
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-receiver
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

# -- OTLP export target. Only consulted by an app built with scalo's
# otel features; ignored otherwise. Empty leaves the app's own default
# in place rather than switching anything off. Example:
# http://opentelemetry-collector.observability:4317
# Spans can carry request attributes, so keep this in-cluster. To leave
# the cluster use https:// and set the OTel SDK's certificate env vars.
otel:
  endpoint: ""
  protocol: grpc

# -- Pod-level security context. Matches the uid the generated image
# switches to; change both together or the container will not start.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. readOnlyRootFilesystem stays
# false because the spool and DLQ write to disk and the only volume
# mounted here is the read-only config map; set it true only for an
# app that spools nowhere.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe-receiver/config.yaml)
config:
  server:
    bind_address: 0.0.0.0:8080
    max_body_size: 10485760
    request_timeout_ms: 30000
    auth:
      mode: none
  grpc:
    enabled: false
    bind_address: 0.0.0.0:6000
  otlp:
    enabled: false
    grpc_bind_address: 0.0.0.0:4317
    http_bind_address: 0.0.0.0:4318
    mode: hyperdx
  lumberjack:
    enabled: false
    bind_address: 0.0.0.0:5044
  splunk_hec:
    enabled: false
    bind_address: 0.0.0.0:8088
  prometheus_rw:
    enabled: false
    bind_address: 0.0.0.0:9091
  webhook:
    enabled: false
    bind_address: 0.0.0.0:8090
  syslog:
    enabled: false
    udp_bind_address: 0.0.0.0:514
    tcp_bind_address: 0.0.0.0:514
    tls_bind_address: 0.0.0.0:6514
  fluent:
    enabled: false
    bind_address: 0.0.0.0:24224
  gelf:
    enabled: false
    bind_address: 0.0.0.0:12201
  flow:
    enabled: false
    experimental: true
    bind_address: 0.0.0.0
    ports:
    - 2055
    - 4739
    - 6343
    output:
      mode: canonical
      max_records_per_packet: 200
    channel_capacity: 4096
    recv_buffer_bytes: 8388608
    rate_limit:
      enabled: false
      packets_per_second: 5000
      burst: 10000
      cache_size: 4096
    netflow:
      enabled: true
      template_cache:
        max_per_exporter: 1000
        max_exporters: 10000
      topic: netflow_land
    sflow:
      enabled: true
      topic: sflow_land
  kafka:
    brokers:
    - kafka:9092
    client_id: dfe-receiver
    producer:
      compression: zstd
      acks: all
  routing:
    default_source: main
    topic_suffix: _land
  metrics:
    enabled: true
    address: 0.0.0.0:9090

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- auth credentials
auth:
  existingSecret: ""
  secretKeys:
    bearer-tokens: bearer-tokens
  bearer-tokens: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 120
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
