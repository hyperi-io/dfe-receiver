# Project:   dfe-receiver
# File:      Cargo.toml
# Purpose:   High-performance HTTP/gRPC receiver for data ingestion
# Language:  Rust
#
# License:   FSL-1.1-ALv2
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-receiver"
version = "1.15.8"
edition = "2024"
description = "High-performance HTTP/gRPC receiver for PB/s scale data ingestion"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-receiver"
exclude = [".claude/", ".github/", "ai/", "ci/", "chart/", "docs/", "reference/", "scripts/", "benches/"]

[lib]
name = "dfe_receiver"
path = "src/lib.rs"
doctest = false

[dependencies]
# HyperI shared library (crates.io)
hyperi-rustlib = { version = ">=2.7.0", features = [
    "config",
    "config-reload",
    "logger",
    "memory",
    "metrics",
    "metrics-dfe",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "dlq-kafka",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    "scaling",
    "cli-service",
    "deployment",
    "version-check",
    "worker-pool",
] }

# Prometheus metrics (direct dep for counter!/gauge! macros with labels)
metrics = "0.24"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tokio-stream = "0.1"
futures-core = "0.3"

# JSON (SIMD-accelerated)
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# HTTP server
axum = "0.8"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout", "compression-zstd", "limit"] }
http = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }

# gRPC server
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"


# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

# Rate limiting
tower_governor = { version = "0.8", features = ["axum"] }

# IP filtering (CIDR allowlist/denylist)
ipnet = "2"
ipnet-trie = "0.3"

# Crypto (bearer token hashing for constant-time comparison)
ring = "0.17"

# Performance
rustc-hash = "2"
compact_str = "0.9"
parking_lot = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Syslog parsing (RFC 5424 + RFC 3164)
syslog_loose = "0.23"

# MessagePack (Fluent Forward protocol)
rmpv = "1.3"

# Compression
flate2 = "1"
snap = "1.1"

# Encoding
base64 = "0.22"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
# Optional allocators
tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", optional = true }

# Optional pgo-driver dependencies (feature-gated)
reqwest = { version = "0.13", features = ["json"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
reqwest = { version = "0.13", features = ["json"] }
dotenvy = "0.15"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "sasl"] }
temp-env = { version = "0.3", features = ["async_closure"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "hashicorp_vault", "minio"] }

[features]
default = ["otlp"]
otlp = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
# PGO/profiling workload driver; not built by default. Used by
# scripts/pgo-workload.sh during hyperi-ci Tier 2 builds.
# NOTE: the `[[bin]] pgo-driver` target has `required-features =
# ["pgo-driver"]` so hyperi-ci's binary-detection skips it on default
# builds (hyperi-ci >= v1.9.2 respects required-features).
pgo-driver = ["dep:reqwest"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "throughput"
harness = false

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo-driver.rs"
required-features = ["pgo-driver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Allow these pedantic lints (too noisy for early development)
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
if_not_else = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_update = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
derivable_impls = "allow"
trivially_copy_pass_by_ref = "allow"
format_push_string = "allow"
single_char_add_str = "allow"
uninlined_format_args = "allow"
unnecessary_literal_bound = "allow"


