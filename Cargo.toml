# Project:   dfe-receiver
# File:      Cargo.toml
# Purpose:   High-performance HTTP/gRPC receiver for data ingestion
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-receiver"
version = "1.15.10"
edition = "2024"
description = "Ingest endpoint for OTLP, Splunk HEC and Prometheus remote-write, writing straight to Kafka. Runs standalone or as part of the HyperI Data Fusion Engine."
license-file = "LICENSE"
repository = "https://github.com/hyperi-io/dfe-receiver"
exclude = [".github/", "chart/", "docs/", "reference/", "scripts/", "benches/"]

[lib]
name = "dfe_receiver"
path = "src/lib.rs"
doctest = false

[dependencies]
# scalo shared library (crates.io)
scalo = { version = ">=2.10.7, <3", features = [
    "config",
    "config-reload",
    "config-schema",
    "logger",
    "memory",
    "metrics",
    "service-metrics",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "dlq-kafka",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    "scaling",
    # CEL expression evaluation -- REQUIRED for the scalo ScalingEngine to
    # build (`#[cfg(all(scaling, expression))]`). Without it the horizontal
    # scaling-pressure engine, its smart-default `dfe_scaling_pressure`
    # gauge, and the compound `transport_inbound_pressure_ratio` are NOT emitted
    # and any `scaling.transport`/`params`/`pressures` YAML is silently inert.
    # cli-service does not pull this in, so list it explicitly.
    "expression",
    "cli-service",
    "deployment",
    "version-check",
    "worker-pool",
    # Self-regulation governor: the runtime builds the default-ON pressure
    # governor; the receiver (an originator) threads its UnifiedPressure into
    # the HTTP/gRPC ingest brake (503 / UNAVAILABLE shed). Transitively pulled
    # in by cli-service, listed explicitly so the dependency is unambiguous.
    "governor",
] }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.1, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# Prometheus metrics (direct dep for counter!/gauge! macros with labels)
metrics = "0.24"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tokio-stream = "0.1"
futures-core = "0.3"

# JSON (SIMD-accelerated)
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# HTTP server
axum = "0.8"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["timeout", "compression-zstd", "limit"] }
http = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }

# gRPC server
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"


# TLS
rustls = "0.23"
# PEM parsing via rustls-pki-types PemObject (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134). Mirrors scalo src/tls.rs. `std` enables the reader/file iters.
rustls-pki-types = { version = ">=1.14, <2", features = ["std"] }
tokio-rustls = "0.26"

# Rate limiting
tower_governor = { version = "0.8", features = ["axum"] }

# IP filtering (CIDR allowlist/denylist)
ipnet = "2"
ipnet-trie = "0.3"

# Crypto (bearer token hashing for constant-time comparison)
ring = "0.17"

# Performance
rustc-hash = "2"
compact_str = "0.10"
parking_lot = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Syslog parsing (RFC 5424 + RFC 3164)
syslog_loose = "0.23"

# MessagePack (Fluent Forward protocol)
rmpv = "1.3"

# Compression
flate2 = "1"
snap = "1.1"

# Encoding
base64 = "0.23"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

# Flow handlers (NetFlow, sFlow, IPFIX parsing)
netgauze-flow-pkt = { version = ">=0.12, <0.13", features = ["serde", "codec"] }
nom = ">=8.0, <9"
socket2 = ">=0.6.3, <0.7"
dashmap = ">=6.1, <7"

# Optional allocator. DFE policy is jemalloc only.
tikv-jemallocator = { version = "0.7", optional = true }

# Optional pgo-driver dependencies (feature-gated)
reqwest = { version = "0.13", features = ["json"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = ">=0.31, <0.32", features = ["socket", "uio"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
reqwest = { version = "0.13", features = ["json"] }
dotenvy = "0.15"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "sasl"] }
temp-env = { version = "0.3", features = ["async_closure"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "hashicorp_vault", "minio"] }
pcap-file = ">=2.0, <3"
sha2 = ">=0.10, <0.12"

# Contract artefact e2e (tests/e2e/contract_artefacts.rs) — pulls in
# probe/skip/cluster helpers from scalo's test_support module.
scalo = { version = ">=2.10.7, <3", features = ["deployment-test-support"] }

[features]
default = ["otlp"]
otlp = []
jemalloc = ["dep:tikv-jemallocator"]
# PGO/profiling workload driver; not built by default. Used by
# scripts/pgo-workload.sh during hyperi-ci Tier 2 builds.
# NOTE: the `[[bin]] pgo-driver` target has `required-features =
# ["pgo-driver"]` so hyperi-ci's binary-detection skips it on default
# builds (hyperi-ci >= v1.9.2 respects required-features).
pgo-driver = ["dep:reqwest"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "flow_decode"
harness = false

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo-driver.rs"
required-features = ["pgo-driver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Allow these pedantic lints (too noisy for early development)
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
if_not_else = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_update = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
derivable_impls = "allow"
trivially_copy_pass_by_ref = "allow"
format_push_string = "allow"
single_char_add_str = "allow"
uninlined_format_args = "allow"
unnecessary_literal_bound = "allow"


