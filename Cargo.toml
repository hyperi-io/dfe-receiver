# Project:   dfe-receiver
# File:      Cargo.toml
# Purpose:   High-performance HTTP/gRPC receiver for data ingestion
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-receiver"
version = "1.15.10"
edition = "2024"
description = "The front door of a DFE deployment: takes events in the protocols agents already speak and hands them on as JSON."
license-file = "LICENSE"
repository = "https://github.com/hyperi-io/dfe-receiver"
exclude = [".github/", "docs/", "reference/", "scripts/", "benches/"]

[lib]
name = "dfe_receiver"
path = "src/lib.rs"
doctest = false

[dependencies]
# The floor moves with `release.helm.library` in .hyperi-ci.yaml.
scalo = { version = ">=2.14.34, <3", features = [
    "config",
    "config-reload",
    "config-schema",
    "logger",
    "memory",
    "metrics",
    "service-metrics",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "dlq-kafka",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    # `vault:` secret refs resolve through scalo's OpenBao provider, compiled in only with this.
    "secrets-vault",
    # `aws:` secret refs resolve through scalo's AWS provider, compiled in only with this.
    "secrets-aws",
    # `ServerTls`: every TLS listener's certificate, its reload and the handshake.
    "tls",
    "scaling",
    # The webhook CEL `filter` calls scalo::expression directly. `rules` turns it on too.
    "expression",
    "rules",
    "cli-service",
    "deployment",
    "version-check",
    "worker-pool",
    # Pulled in by cli-service too, listed because the ingest brake uses it.
    "governor",
] }

# Config-schema derivation. Same range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# The Kafka sink's own producer, because scalo's producer context has no
# delivery callback. Same range and build as scalo so cargo resolves one librdkafka.
rdkafka = { version = ">=0.40.0, <0.41", features = ["dynamic-linking"] }

# Direct, for the labelled counter!/gauge! macros.
metrics = "0.24.6"

tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt", "codec"] }
tokio-stream = "0.1.19"
futures-core = "0.3.34"

sonic-rs = "0.5.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

axum = "0.8.9"
bytes = "1.12.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["timeout", "limit"] }
http = "1.5.0"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "service"] }

# aws-lc-rs only: with ring compiled in too, rustls cannot pick a provider and every TLS listener panics.
tonic = { version = "0.14.9", features = ["tls-aws-lc"] }
tonic-prost = "0.14.9"
prost = "0.14.6"
prost-types = "0.14.6"

tokio-rustls = "0.26.6"

tower_governor = { version = "0.8", features = ["axum"] }

ipnet = "2.12.2"
ipnet-trie = "0.3.1"

# Token hashing and webhook HMAC on the provider rustls and tonic already use.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "alloc"] }

# scalo compiles CEL but does not re-export `Program`, which the webhook filter holds. Same range as scalo.
cel = { version = ">=0.14.5, <0.15", features = ["json"] }

memchr = "2.8.3"
rustc-hash = "2.1.3"
compact_str = "0.10"
parking_lot = "0.13.0"
arc-swap = "1.9.5"

thiserror = "2.0.21"
anyhow = "1.0.104"

clap = { version = "4.6.7", features = ["derive", "env"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

syslog_loose = "0.23"

# Fluent Forward. rmp, already under rmpv, gives the markers the Forward scanner reads.
rmpv = "1.3.1"
rmp = "0.8.15"

flate2 = "1.1.11"
snap = "1.1.2"

base64 = "0.23.1"

jiff = ">=1.0.0, <2"
# Only where syslog_loose and netgauze take or return chrono types.
chrono = "0.4.45"
uuid = { version = "1.29.2", features = ["v4"] }
async-trait = "0.1.92"

netgauze-flow-pkt = { version = ">=0.14.0, <0.15", features = ["serde", "codec"] }
nom = ">=8.0, <9"
socket2 = ">=0.6.5, <0.7"
# Batched syslog UDP reads. The line quinn already locks.
quinn-udp = { version = ">=0.6.3, <0.7", default-features = false }
dashmap = ">=6.2.1, <7"

# Optional allocator. DFE policy is jemalloc only.
tikv-jemallocator = { version = "0.7", optional = true }

reqwest = { version = "0.13.5", features = ["json"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14.9"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
proptest = "1.12.0"
tokio-test = "0.4.6"
reqwest = { version = "0.13.5", features = ["json"] }
dotenvy = "0.15.7"
# The TLS client the listener tests handshake with.
rustls = "0.23.46"
# aws-lc-rs only, like the runtime: ring beside it leaves rustls without a default provider.
rcgen = { version = ">=0.14.10, <0.15", default-features = false, features = ["pem", "aws_lc_rs"] }
rdkafka = { version = ">=0.40.0, <0.41", features = ["cmake-build", "ssl", "sasl"] }
temp-env = { version = "0.3.6", features = ["async_closure"] }
pcap-file = ">=3.0.0, <4"
sha2 = ">=0.11.1, <0.12"
# Allocation counts for benches/syslog_allocs.rs only.
allocation-counter = "0.8.1"

# Test support: contract e2e helpers, the Vector-compat gRPC client and the shared Kafka broker.
scalo = { version = ">=2.14.34, <3", features = [
    "deployment-test-support",
    "transport-grpc-vector-compat",
    "transport-kafka-test-support",
] }

[features]
default = ["otlp"]
otlp = []
jemalloc = ["dep:tikv-jemallocator"]
# PGO workload driver (scripts/pgo-workload.sh). It sends OTLP logs, so it needs otlp.
pgo-driver = ["dep:reqwest", "otlp"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "flow_decode"
harness = false

[[bench]]
name = "json_depth"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "syslog"
harness = false

[[bench]]
name = "syslog_allocs"
harness = false

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# Two scalo structs are built with `..default`, so a field scalo adds does not break the build.
needless_update = "allow"
# The rest are for the integration tests and benches.
doc_markdown = "allow"
uninlined_format_args = "allow"
format_push_string = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
needless_raw_string_hashes = "allow"


