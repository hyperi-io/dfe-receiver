# Project:   dfe-receiver
# File:      Cargo.toml
# Purpose:   High-performance HTTP/gRPC receiver for data ingestion
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-receiver"
version = "1.15.10"
edition = "2024"
description = "Ingest endpoint for OTLP, Splunk HEC and Prometheus remote-write, writing straight to Kafka. Runs standalone or as part of the HyperI Data Fusion Engine."
license-file = "LICENSE"
repository = "https://github.com/hyperi-io/dfe-receiver"
exclude = [".github/", "chart/", "docs/", "reference/", "scripts/", "benches/"]

[lib]
name = "dfe_receiver"
path = "src/lib.rs"
doctest = false

[dependencies]
# scalo shared library (crates.io). The floor is the first release that writes
# contract schema version 4. The contract carries no vendor defaults, so the
# app names its own.
scalo = { version = "2.14.4", features = [
    "config",
    "config-reload",
    "config-schema",
    "logger",
    "memory",
    "metrics",
    "service-metrics",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "dlq-kafka",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    # `vault:` secret refs (bearer tokens, webhook caller secrets) resolve
    # through scalo's OpenBao provider, which only compiles in with this on.
    "secrets-vault",
    "scaling",
    # The webhook per-caller CEL `filter` compiles and validates through
    # scalo::expression, and no other feature listed here pulls it in.
    "expression",
    "cli-service",
    "deployment",
    "version-check",
    "worker-pool",
    # Self-regulation governor: the runtime builds the default-ON pressure
    # governor; the receiver (an originator) threads its UnifiedPressure into
    # the HTTP/gRPC ingest brake (503 / UNAVAILABLE shed). Transitively pulled
    # in by cli-service, listed explicitly so the dependency is unambiguous.
    "governor",
] }

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.2, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# librdkafka, for the Kafka sink's own producer. The delivery callback lives on
# the context handed to librdkafka at creation, and scalo's producer context has
# no delivery body (scalo-rs#26), so a broker-side refusal is invisible through
# `scalo::transport::kafka::KafkaProducer`. Same version range and the same
# `dynamic-linking` build as scalo so cargo resolves one librdkafka.
rdkafka = { version = ">=0.39, <0.40", features = ["dynamic-linking"] }

# Prometheus metrics (direct dep for counter!/gauge! macros with labels)
metrics = "0.24.6"

# Async runtime
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt", "codec"] }
tokio-stream = "0.1.19"
futures-core = "0.3.34"

# JSON (SIMD-accelerated)
sonic-rs = "0.5.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"

# HTTP server
axum = "0.8.9"
bytes = "1.12.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["timeout", "compression-zstd", "limit"] }
http = "1.5.0"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "service"] }

# gRPC server
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"


# TLS
rustls = "0.23.45"
# PEM parsing via rustls-pki-types PemObject (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134). Mirrors scalo src/tls.rs. `std` enables the reader/file iters.
rustls-pki-types = { version = ">=1.15.1, <2", features = ["std"] }
tokio-rustls = "0.26.6"

# Rate limiting
tower_governor = { version = "0.8", features = ["axum"] }

# IP filtering (CIDR allowlist/denylist)
ipnet = "2.12.2"
ipnet-trie = "0.3.1"

# Crypto (bearer token hashing for constant-time comparison, webhook HMAC)
ring = "0.17.14"

# CEL programs for the webhook per-caller filter. scalo compiles them
# (`scalo::expression::compile`) but does not re-export the `Program` type, so
# holding a compiled program across requests needs the crate directly. Same
# range as scalo so cargo unifies to one copy.
cel = { version = ">=0.14.5, <0.15", features = ["json"] }

# Performance
rustc-hash = "2.1.3"
compact_str = "0.10"
parking_lot = "0.12.5"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Syslog parsing (RFC 5424 + RFC 3164)
syslog_loose = "0.23"

# MessagePack (Fluent Forward protocol)
rmpv = "1.3.1"

# Compression
flate2 = "1.1.10"
snap = "1.1.2"

# Encoding
base64 = "0.23.1"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4"] }
async-trait = "0.1.92"

# Flow handlers (NetFlow, sFlow, IPFIX parsing)
netgauze-flow-pkt = { version = ">=0.13.0, <0.14", features = ["serde", "codec"] }
nom = ">=8.0, <9"
socket2 = ">=0.6.5, <0.7"
dashmap = ">=6.2.1, <7"

# Optional allocator. DFE policy is jemalloc only.
tikv-jemallocator = { version = "0.7", optional = true }

# Optional pgo-driver dependencies (feature-gated)
reqwest = { version = "0.13.5", features = ["json"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = ">=0.31.3, <0.32", features = ["socket", "uio"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
proptest = "1.11.0"
tokio-test = "0.4.6"
reqwest = { version = "0.13.5", features = ["json"] }
dotenvy = "0.15.7"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "sasl"] }
temp-env = { version = "0.3.6", features = ["async_closure"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "hashicorp_vault"] }
pcap-file = ">=2.0, <3"
sha2 = ">=0.11.0, <0.12"

# Contract artefact e2e (tests/e2e/contract_artefacts.rs) -- pulls in
# probe/skip/cluster helpers from scalo's test_support module.
# transport-grpc-vector-compat is test-only: it gives VectorCompatClient, the
# same PushEvents client dfe-fetcher and Vector use, so the gRPC ingest path can
# be driven in-process. Dev-dep features do not reach a release build.
scalo = { version = "2.14.4", features = [
    "deployment-test-support",
    "transport-grpc-vector-compat",
] }

[features]
default = ["otlp"]
otlp = []
jemalloc = ["dep:tikv-jemallocator"]
# PGO/profiling workload driver; not built by default. Used by
# scripts/pgo-workload.sh during hyperi-ci Tier 2 builds.
# NOTE: the `[[bin]] pgo-driver` target has `required-features =
# ["pgo-driver"]` so hyperi-ci's binary-detection skips it on default
# builds (hyperi-ci >= v1.9.2 respects required-features).
pgo-driver = ["dep:reqwest"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "flow_decode"
harness = false

[[bench]]
name = "json_depth"
harness = false

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Allow these pedantic lints (too noisy for early development)
needless_raw_string_hashes = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
if_not_else = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
needless_update = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
derivable_impls = "allow"
trivially_copy_pass_by_ref = "allow"
format_push_string = "allow"
single_char_add_str = "allow"
uninlined_format_args = "allow"
unnecessary_literal_bound = "allow"


