# Project:   dfe-receiver
# File:      Cargo.toml
# Purpose:   High-performance HTTP/gRPC receiver for data ingestion
# Language:  Rust
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-receiver"
version = "1.15.10"
edition = "2024"
description = "The front door of a DFE deployment: takes events in the protocols agents already speak and hands them on as JSON."
license-file = "LICENSE"
repository = "https://github.com/hyperi-io/dfe-receiver"
exclude = [".github/", "docs/", "reference/", "scripts/", "benches/"]

[lib]
name = "dfe_receiver"
path = "src/lib.rs"
doctest = false

[dependencies]
# The floor moves with `release.helm.library` in .hyperi-ci.yaml.
scalo = { version = "2.14.29", features = [
    "config",
    "config-reload",
    "config-schema",
    "logger",
    "memory",
    "metrics",
    "service-metrics",
    "http-server",
    "transport-kafka",
    "transport-grpc",
    "dlq-kafka",
    "spool",
    "tiered-sink",
    "runtime",
    "secrets",
    # `vault:` secret refs (bearer tokens, webhook caller secrets) resolve
    # through scalo's OpenBao provider, which only compiles in with this on.
    "secrets-vault",
    # `aws:` secret refs (bearer tokens, webhook caller secrets) resolve
    # through scalo's AWS provider, which only compiles in with this on.
    "secrets-aws",
    "scaling",
    # The webhook per-caller CEL `filter` compiles and validates through
    # scalo::expression, and no other feature listed here pulls it in.
    "expression",
    # The `rules` section: the ordered rule set that sets `_source` and `_org_id`, and its clamp.
    "rules",
    "cli-service",
    "deployment",
    "version-check",
    "worker-pool",
    # Pulled in by cli-service too, listed because the ingest brake uses it.
    "governor",
] }

# Config-schema derivation. Same range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# The Kafka sink's own producer, because scalo's producer context has no
# delivery callback. Same range and build as scalo so cargo resolves one librdkafka.
rdkafka = { version = ">=0.39, <0.40", features = ["dynamic-linking"] }

# Prometheus metrics (direct dep for counter!/gauge! macros with labels)
metrics = "0.24.6"

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt", "codec"] }
tokio-stream = "0.1.19"
futures-core = "0.3.34"

# JSON (SIMD-accelerated)
sonic-rs = "0.5.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# HTTP server
axum = "0.8.9"
bytes = "1.12.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["timeout", "limit"] }
http = "1.5.0"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "service"] }

# gRPC server
# aws-lc-rs, the provider scalo and rustls's defaults already pull in. With ring
# compiled in too, rustls refuses to pick one and every TLS listener panics.
tonic = { version = "0.14.9", features = ["tls-aws-lc"] }
tonic-prost = "0.14.9"
prost = "0.14.4"
prost-types = "0.14.4"


# TLS
rustls = "0.23.46"
# PEM parsing via rustls-pki-types PemObject (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134). Mirrors scalo src/tls.rs. `std` enables the reader/file iters.
rustls-pki-types = { version = ">=1.15.1, <2", features = ["std"] }
tokio-rustls = "0.26.6"

# Rate limiting
tower_governor = { version = "0.8", features = ["axum"] }

# IP filtering (CIDR allowlist/denylist)
ipnet = "2.12.2"
ipnet-trie = "0.3.1"

# Crypto (bearer token hashing for constant-time comparison, webhook HMAC).
# aws-lc-rs is the provider rustls and tonic already use, so this adds no
# second implementation to the binary.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "alloc"] }

# CEL programs for the webhook per-caller filter. scalo compiles them
# (`scalo::expression::compile`) but does not re-export the `Program` type, so
# holding a compiled program across requests needs the crate directly. Same
# range as scalo so cargo unifies to one copy.
cel = { version = ">=0.14.5, <0.15", features = ["json"] }

# Performance
memchr = "2.8.3"
rustc-hash = "2.1.3"
compact_str = "0.10"
parking_lot = "0.13.0"
arc-swap = "1.9.3"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Syslog parsing (RFC 5424 + RFC 3164)
syslog_loose = "0.23"

# MessagePack (Fluent Forward protocol). rmp, already under rmpv, gives the
# markers the Forward scanner reads.
rmpv = "1.3.1"
rmp = "0.8.15"

# Compression
flate2 = "1.1.10"
snap = "1.1.2"

# Encoding
base64 = "0.23.1"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
async-trait = "0.1.92"

# Flow handlers (NetFlow, sFlow, IPFIX parsing)
netgauze-flow-pkt = { version = ">=0.13.0, <0.14", features = ["serde", "codec"] }
nom = ">=8.0, <9"
socket2 = ">=0.6.5, <0.7"
# Batched UDP reads for syslog: recvmmsg on Linux, the platform's own call
# elsewhere. The line quinn already locks.
quinn-udp = { version = ">=0.6.3, <0.7", default-features = false }
dashmap = ">=6.2.1, <7"

# Optional allocator. DFE policy is jemalloc only.
tikv-jemallocator = { version = "0.7", optional = true }

# Optional pgo-driver dependencies (feature-gated)
reqwest = { version = "0.13.5", features = ["json"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14.9"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
proptest = "1.12.0"
tokio-test = "0.4.6"
reqwest = { version = "0.13.5", features = ["json"] }
dotenvy = "0.15.7"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "sasl"] }
temp-env = { version = "0.3.6", features = ["async_closure"] }
pcap-file = ">=2.0, <3"
sha2 = ">=0.11.1, <0.12"
# Allocation counts for benches/syslog_allocs.rs only.
allocation-counter = "0.8.1"

# Test support: contract e2e helpers, the Vector-compat gRPC client and the shared Kafka broker.
scalo = { version = "2.14.29", features = [
    "deployment-test-support",
    "transport-grpc-vector-compat",
    "transport-kafka-test-support",
] }

[features]
default = ["otlp"]
otlp = []
jemalloc = ["dep:tikv-jemallocator"]
# PGO workload driver (scripts/pgo-workload.sh). It sends OTLP logs, so it needs otlp.
pgo-driver = ["dep:reqwest", "otlp"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "flow_decode"
harness = false

[[bench]]
name = "json_depth"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "syslog"
harness = false

[[bench]]
name = "syslog_allocs"
harness = false

[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Use pedantic but allow some overly strict lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# Two scalo structs are built with `..default`, so a field scalo adds does not break the build.
needless_update = "allow"
# The rest are for the integration tests and benches.
doc_markdown = "allow"
uninlined_format_args = "allow"
format_push_string = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
needless_raw_string_hashes = "allow"


