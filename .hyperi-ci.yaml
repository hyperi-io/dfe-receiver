#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.
# Binary artifacts published to GitHub Releases and Cloudflare R2.

language: rust
quality:
  enabled: true
  rust:
    features: default
test:
  enabled: true
  coverage: false
  rust:
    features: default
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    features: default
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Release-track build optimisation (hyperi-ci Tier 1/2).
    # Channel-gated defaults for allocator + LTO apply automatically:
    #   alpha       → jemalloc + thin LTO
    #   beta        → jemalloc + fat LTO
    #   release     → jemalloc + fat LTO + PGO/BOLT (opt-in below)
    # See docs/PERFORMANCE.md and hyperi-ci's
    # docs/languages/rust.md for the full contract.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        duration_secs: 300
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets
publish:
  enabled: true
  target: both
  binaries: both
