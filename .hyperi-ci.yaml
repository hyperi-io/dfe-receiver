# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: rust
quality:
  enabled: true
  rust:
    features: default
test:
  enabled: true
  coverage: false
  rust:
    features: default
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    features: default
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
publish:
  enabled: true
  target: both
