# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.
# Binary artifacts published to GitHub Releases and Cloudflare R2.

language: rust
quality:
  enabled: true
  # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 is in the
  # lock through scalo, in the affected range (<= 0.32.0, fixed in 0.32.1). The
  # flaw is in BaggagePropagator::extract_with_context, which parses an inbound
  # W3C Baggage header before enforcing its size limits. It is unreachable: no
  # Baggage propagator is registered in the receiver or in scalo, and OTLP ingest
  # reads only content-type and authorization from a request. Accepted as not
  # reachable in dfe-infra docs/THREAT-MODEL.md, accepted risks. scalo cannot move
  # to 0.32 while metrics-exporter-opentelemetry 0.2.1 requires opentelemetry
  # ^0.31; hyperi-io/scalo-rs#281 tracks the move. A GitHub advisory with no
  # RustSec entry, so only osv-scanner sees it.
  ignore:
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator is registered in dfe-receiver or scalo. Accepted risk in dfe-infra docs/THREAT-MODEL.md. Blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31; tracked in hyperi-io/scalo-rs#281."
  rust:
    # Clippy every feature, so the jemalloc and pgo-driver code a default build skips still compiles.
    features: all
test:
  enabled: true
  coverage: false
  rust:
    features: default
    # The APP_ENV tests rely on nextest running each test in its own process.
    nextest: true
build:
  enabled: true
  strategies:
    - native
  rust:
    features: default
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
# The thin chart is assembled from the emitted contract and ships beside the image.
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.3"
