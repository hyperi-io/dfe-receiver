#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.
# Binary artifacts published to GitHub Releases and Cloudflare R2.

language: rust
quality:
  enabled: true
  rust:
    features: default
test:
  enabled: true
  coverage: false
  rust:
    features: default
build:
  enabled: true
  # PGO and BOLT are off for the rc.14 workstream: each adds 30-60 min per arch
  # and the workstream needs fast turnaround on everything else first. Tier 1
  # (allocator + LTO) still applies. Turning this back off is the LAST rc.14
  # task. A STABLE release meanwhile needs `release-unoptimized: true` at
  # dispatch; a prerelease (rc) is never refused.
  skip_optimize: true
  type: app
  strategies:
    - native
  rust:
    features: default
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
publish:
  enabled: true
  target: both
  binaries: both
