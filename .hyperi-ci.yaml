# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.
# Binary artifacts published to GitHub Releases and Cloudflare R2.

language: rust
quality:
  enabled: true
  # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 is in the
  # lock through scalo, in the affected range (<= 0.32.0, fixed in 0.32.1). The
  # flaw is in BaggagePropagator::extract_with_context, which parses an inbound
  # W3C Baggage header before enforcing its size limits. The receiver takes
  # untrusted input, but none reaches that function: neither the receiver nor
  # scalo names `baggage` or installs a text map propagator, and OTLP ingest
  # reads only content-type and authorization from a request. Recorded as not
  # reachable in the DFE threat model (dfe-infra docs/THREAT-MODEL.md, accepted
  # risks). A GitHub advisory with no RustSec entry, so only osv-scanner sees it.
  ignore:
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: BaggagePropagator::extract_with_context is unreachable (no text map propagator, no baggage in dfe-receiver or scalo). Not reachable per dfe-infra docs/THREAT-MODEL.md accepted risks. Drop when scalo allows opentelemetry_sdk >= 0.32.1."
  rust:
    features: default
test:
  enabled: true
  coverage: false
  rust:
    features: default
build:
  enabled: true
  # PGO and BOLT are off for the rc.14 workstream: each adds 30-60 min per arch
  # and the workstream needs fast turnaround on everything else first. Tier 1
  # (allocator + LTO) still applies. Turning this back off is the LAST rc.14
  # task. A STABLE release meanwhile needs `release-unoptimized: true` at
  # dispatch; a prerelease (rc) is never refused.
  skip_optimize: true
  type: app
  strategies:
    - native
  rust:
    features: default
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
publish:
  enabled: true
  target: both
  binaries: both
